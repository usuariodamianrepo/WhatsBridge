services:
  mongo-server:
    image: mongo:latest
    container_name: mongo-server
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  mongo-client:
    image: mongo-express:latest
    container_name: mongo-client
    restart: always
    depends_on:
      - mongo-server
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-server
      ME_CONFIG_MONGODB_PORT: 27017
    ports:
      - "8081:8081"
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # connect from Apps
      - "15672:15672" # panel web
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: moravia.123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network

  webhook:
    build:
      context: .
      dockerfile: src/Clone.WebApi/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo-server
      - rabbitmq
    environment:
      ConnectionStrings__MongoDb: mongodb://mongo-server:27017/WhatsAppWebhookDb
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: appuser
      RabbitMq__Password: moravia.123
    ports:
      - "8080:8080"
    networks:
      - app_network

  consumer:
    build:
      context: .
      dockerfile: src/Clone.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo-server
      - rabbitmq
    environment:
      ConnectionStrings__MongoDb: mongodb://mongo-server:27017/WhatsAppWebhookDb
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: appuser
      RabbitMq__Password: moravia.123
    networks:
      - app_network

volumes:
  mongodb_data:
  rabbitmq_data:

networks:
  app_network:
